name: 🌐 Deploy — Production

on:
  push:
    tags:
      - 'v*.*.*'           # e.g., v1.0.0, v2.3.1
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type DEPLOY to confirm production deployment'
        required: true

env:
  NODE_VERSION: '20'
  PNPM_VERSION: '9'
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}/bigtv-cms

jobs:
  # ─────────────────────────────────────────
  # GUARD: Confirm manual trigger
  # ─────────────────────────────────────────
  guard:
    name: 🛡️ Deployment Guard
    runs-on: ubuntu-latest
    steps:
      - name: ✅ Check deployment confirmation
        if: github.event_name == 'workflow_dispatch'
        run: |
          if [ "${{ github.event.inputs.confirm }}" != "DEPLOY" ]; then
            echo "❌ Deployment confirmation failed. Type 'DEPLOY' to proceed."
            exit 1
          fi
          echo "✅ Deployment confirmed."

  # ─────────────────────────────────────────
  # JOB 1: Run CI checks first
  # ─────────────────────────────────────────
  ci-check:
    name: 🧪 Run CI Checks
    runs-on: ubuntu-latest
    needs: guard
    steps:
      - name: ⬇️ Checkout code
        uses: actions/checkout@v4

      - name: 📦 Setup pnpm
        uses: pnpm/action-setup@v3
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: 🟢 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: 📥 Install dependencies
        run: pnpm install --frozen-lockfile

      - name: 🔍 Lint
        run: pnpm lint

      - name: 🧪 Test with coverage
        run: pnpm test:coverage
        env:
          CI: true

  # ─────────────────────────────────────────
  # JOB 2: Build & Push Production Image
  # ─────────────────────────────────────────
  docker-build-prod:
    name: 🐳 Build Production Docker Image
    runs-on: ubuntu-latest
    needs: ci-check
    permissions:
      contents: read
      packages: write

    outputs:
      image-tag: ${{ steps.meta.outputs.tags }}

    steps:
      - name: ⬇️ Checkout code
        uses: actions/checkout@v4

      - name: 🔐 Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 🏷️ Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest

      - name: 🔧 Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: 🐳 Build and push production image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            NEXT_PUBLIC_API_BASE_URL=${{ secrets.PROD_API_BASE_URL }}
            NEXT_PUBLIC_APP_NAME=BigTV CMS
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ─────────────────────────────────────────
  # JOB 3: Deploy to Production
  # ─────────────────────────────────────────
  deploy-production:
    name: 🌐 Deploy to Production
    runs-on: ubuntu-latest
    needs: docker-build-prod
    environment:
      name: production
      url: https://cms.bigtv.in

    steps:
      - name: 🔐 SSH & Deploy to Production Server
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.PROD_SERVER_HOST }}
          username: ${{ secrets.PROD_SERVER_USER }}
          key: ${{ secrets.PROD_SSH_PRIVATE_KEY }}
          script: |
            echo "🌐 Deploying BigTV CMS to Production..."

            # Pull latest production image
            docker pull ghcr.io/${{ github.repository }}/bigtv-cms:latest

            # Blue-green: stop old, start new
            docker stop bigtv-cms-prod || true
            docker rm bigtv-cms-prod || true

            # Start new production container
            docker run -d \
              --name bigtv-cms-prod \
              --restart unless-stopped \
              -p 3000:3000 \
              -e NEXT_PUBLIC_API_BASE_URL=${{ secrets.PROD_API_BASE_URL }} \
              -e NODE_ENV=production \
              ghcr.io/${{ github.repository }}/bigtv-cms:latest

            # Cleanup dangling images
            docker image prune -f

            echo "✅ Production deployment complete!"

      - name: 🏷️ Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          body: |
            ## 🚀 BigTV CMS ${{ github.ref_name }}

            ### What's Changed
            See commit history for full changelog.

            ### Docker Image
            ```
            docker pull ghcr.io/${{ github.repository }}/bigtv-cms:${{ github.ref_name }}
            ```

            ### Deploy
            Live at: https://cms.bigtv.in

      - name: 📣 Deployment complete
        run: |
          echo "🎉 Production deployment successful!"
          echo "Version: ${{ github.ref_name }}"
          echo "URL: https://cms.bigtv.in"
