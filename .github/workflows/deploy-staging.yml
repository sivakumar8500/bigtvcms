name: 🚀 Deploy — Staging

on:
  push:
    branches:
      - develop
  workflow_dispatch:
    inputs:
      reason:
        description: 'Reason for manual deployment'
        required: false
        default: 'Manual deploy to staging'

env:
  NODE_VERSION: '20'
  PNPM_VERSION: '9'
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}/bigtv-cms

jobs:
  # ─────────────────────────────────────────
  # JOB 1: Build & Push Docker Image
  # ─────────────────────────────────────────
  docker-build:
    name: 🐳 Build & Push Docker Image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    outputs:
      image-tag: ${{ steps.meta.outputs.tags }}
      image-digest: ${{ steps.build.outputs.digest }}

    steps:
      - name: ⬇️ Checkout code
        uses: actions/checkout@v4

      - name: 🔐 Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 🏷️ Extract Docker metadata (tags, labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=sha,prefix=sha-
            type=raw,value=staging-latest

      - name: 🔧 Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: 🐳 Build and push Docker image
        id: build
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            NEXT_PUBLIC_API_BASE_URL=${{ secrets.STAGING_API_BASE_URL }}
            NEXT_PUBLIC_APP_NAME=BigTV CMS (Staging)
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ─────────────────────────────────────────
  # JOB 2: Deploy to Staging Server
  # ─────────────────────────────────────────
  deploy-staging:
    name: 🚀 Deploy to Staging
    runs-on: ubuntu-latest
    needs: docker-build
    environment:
      name: staging
      url: https://cms-staging.bigtv.in

    steps:
      - name: 🔐 SSH & Deploy to Staging Server
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.STAGING_SERVER_HOST }}
          username: ${{ secrets.STAGING_SERVER_USER }}
          key: ${{ secrets.STAGING_SSH_PRIVATE_KEY }}
          script: |
            echo "🚀 Deploying BigTV CMS to Staging..."

            # Pull latest image
            docker pull ghcr.io/${{ github.repository }}/bigtv-cms:staging-latest

            # Stop existing container
            docker stop bigtv-cms-staging || true
            docker rm bigtv-cms-staging || true

            # Start new container
            docker run -d \
              --name bigtv-cms-staging \
              --restart unless-stopped \
              -p 3000:3000 \
              -e NEXT_PUBLIC_API_BASE_URL=${{ secrets.STAGING_API_BASE_URL }} \
              -e NODE_ENV=production \
              ghcr.io/${{ github.repository }}/bigtv-cms:staging-latest

            # Cleanup old images
            docker image prune -f

            echo "✅ Staging deployment complete!"

      - name: 📣 Notify deployment success
        if: success()
        run: |
          echo "✅ Successfully deployed to staging: https://cms-staging.bigtv.in"
          echo "Image: ghcr.io/${{ github.repository }}/bigtv-cms:staging-latest"
          echo "Commit: ${{ github.sha }}"
          echo "Branch: ${{ github.ref_name }}"
